<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>A Névoa de 1950 — abertura</title>
<style>
@font-face{font-family:Anton;src:url(font1.ttf)}
@font-face{font-family:"Special Elite";src:url(font2.ttf)}
@font-face{font-family:Cormorant;font-weight:500;src:url(font3.ttf)}
@font-face{font-family:Cormorant;font-weight:700;src:url(font4.ttf)}
html,body{margin:0;background:#000;overflow:hidden}
canvas{display:block;width:1920px;height:1080px}
</style></head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="timeline.js"></script>
<script>
/* Tudo é função pura do tempo t (segundos): render(t) desenha o quadro inteiro.
   Paleta: névoa cinza-azulada + vermelho do pigmento da Serratia + papel envelhecido. */
const W=1920,H=1080,FPS=24;
const TL=window.TIMELINE,C=window.CUES,S={};TL.frases.forEach(f=>S[f.i]=f);
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const RED='#b3121d',RED2='#e2333b',PAPER='#d9d0bb',INK='#d8d2c2';
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>{x=clamp(x);return x*x*(3-2*x)};
const eOut=x=>1-Math.pow(1-clamp(x),3);
const lerp=(a,b,u)=>a+(b-a)*u;

/* ---------- texturas ---------- */
function fogTex(seed){const w=256,h=144,c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');const id=g.createImageData(w,h);const r=rng(seed);
  const L=[];for(let o=0;o<4;o++){const n=4<<o;const gw=n+2,gh=Math.ceil(n*h/w)+2;const a=new Float32Array(gw*gh);for(let i=0;i<a.length;i++)a[i]=r();L.push({n,gw,a})}
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){let v=0,amp=.5,tot=0;
    for(const l of L){const fx=x/w*l.n,fy=y/w*l.n;const x0=Math.floor(fx),y0=Math.floor(fy);const tx=fx-x0,ty=fy-y0;const sx=tx*tx*(3-2*tx),sy=ty*ty*(3-2*ty);const i=y0*l.gw+x0;const a=l.a[i],b=l.a[i+1],c2=l.a[i+l.gw],d=l.a[i+l.gw+1];v+=amp*(a+(b-a)*sx+(c2-a)*sy+(a-b-c2+d)*sx*sy);tot+=amp;amp*=.5}
    v/=tot;v=clamp((v-.36)/.38);const k=(y*w+x)*4;id.data[k]=196;id.data[k+1]=212;id.data[k+2]=218;id.data[k+3]=Math.pow(v,1.4)*255}
  g.putImageData(id,0,0);return c}
const FOG=[fogTex(11),fogTex(29),fogTex(53)];
function fog(t,a,yoff=0){ctx.save();ctx.globalCompositeOperation='screen';
  for(let i=0;i<3;i++){const sc=1.9+i*.45;const w=W*sc,h=H*sc;const x=-(w-W)*(.5+.5*Math.sin(t*(.021+i*.013)+i*2.1));const y=-(h-H)*(.5+.5*Math.cos(t*(.017+i*.01)+i))+yoff;ctx.globalAlpha=a*(.55-i*.13);ctx.drawImage(FOG[i],x,y,w,h)}
  ctx.restore()}
const GR=[];for(let i=0;i<5;i++){const c=document.createElement('canvas');c.width=960;c.height=540;const g=c.getContext('2d');const id=g.createImageData(960,540);const r=rng(100+i);for(let k=0;k<id.data.length;k+=4){const v=r()*255|0;id.data[k]=id.data[k+1]=id.data[k+2]=v;id.data[k+3]=255}g.putImageData(id,0,0);GR.push(c)}
function post(t,f){
  const g=ctx.createRadialGradient(W/2,H/2,H*.32,W/2,H/2,H*1.02);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.86)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.globalCompositeOperation='overlay';ctx.globalAlpha=.17;ctx.drawImage(GR[f%5],0,0,W,H);ctx.restore();
  ctx.fillStyle='rgba(0,0,0,.10)';for(let y=(f%2);y<H;y+=4)ctx.fillRect(0,y,W,1);
  const fl=.03*Math.sin(f*1.7)+.02*Math.sin(f*.37);ctx.fillStyle=fl>0?`rgba(255,255,255,${fl*.4})`:`rgba(0,0,0,${-fl})`;ctx.fillRect(0,0,W,H)}
function glitch(f,amt){const r=rng(f*7919+13);for(let i=0;i<8;i++){const y=r()*H|0,h=8+r()*80|0,dx=(r()-.5)*amt;ctx.drawImage(cv,0,y,W,h,dx,y,W,h)}
  ctx.fillStyle='rgba(255,255,255,.07)';for(let i=0;i<4;i++)ctx.fillRect(0,r()*H,W,2+r()*5)}

/* ---------- texto ---------- */
const stampCache={};
function stampTex(txt,size,color){const key=txt+'|'+size+'|'+color;if(stampCache[key])return stampCache[key];
  const c=document.createElement('canvas');let g=c.getContext('2d');const ls=size*.035;g.font=`${size}px Anton`;g.letterSpacing=ls+'px';
  const w=Math.ceil(g.measureText(txt).width+60),h=Math.ceil(size*1.35);c.width=w;c.height=h;g=c.getContext('2d');
  g.font=`${size}px Anton`;g.letterSpacing=ls+'px';g.fillStyle=color;g.textBaseline='middle';g.fillText(txt,30,h/2+size*.04);
  g.globalCompositeOperation='destination-out';const r=rng(txt.length*977+size);
  for(let i=0;i<w*h/420;i++){const x=r()*w,y=r()*h,s=r()*r()*size*.028;g.globalAlpha=.45+r()*.55;g.beginPath();g.arc(x,y,s,0,7);g.fill()}
  for(let i=0;i<16;i++){g.globalAlpha=.4;g.fillRect(0,r()*h,w,1+r()*2.5)}
  return stampCache[key]=c}
function stamp(txt,x,y,size,color,age,o={}){if(age<0)return;const c=stampTex(txt,size,color);const k=eOut(age/.14);
  const sc=lerp(1.4,1,k)*(1+age*.010);const a=clamp(age/.05)*(o.alpha??1);const j=Math.floor(age*12);const jx=((j*37)%5-2)*.9,jy=((j*53)%5-2)*.9;
  ctx.save();ctx.translate(x,y);ctx.rotate(o.rot||0);ctx.scale(sc,sc);ctx.globalAlpha=a;ctx.shadowColor='rgba(0,0,0,.85)';ctx.shadowBlur=34;
  ctx.drawImage(c,-c.width/2+jx,-c.height/2+jy);ctx.restore()}
function typed(txt,x,y,size,age,o={}){if(age<0)return;const cps=o.cps||24;const n=Math.min(txt.length,Math.floor(age*cps));
  ctx.save();ctx.font=`${size}px "Special Elite"`;ctx.letterSpacing=(o.ls??2)+'px';ctx.fillStyle=o.color||INK;ctx.textBaseline='middle';ctx.globalAlpha=o.alpha??.92;ctx.shadowColor='rgba(0,0,0,.95)';ctx.shadowBlur=14;
  if(o.align==='center')x-=ctx.measureText(txt).width/2;const s=txt.slice(0,n);ctx.fillText(s,x,y);
  if(n<txt.length||Math.floor(age*2)%2===0){const w=ctx.measureText(s).width;ctx.fillRect(x+w+4,y-size*.45,size*.5,size*.85)}ctx.restore()}
function label(txt,x,y,size,a,o={}){ctx.save();ctx.font=`${size}px "Special Elite"`;ctx.letterSpacing=(o.ls??5)+'px';ctx.fillStyle=o.color||'#aebcb8';ctx.globalAlpha=a;ctx.textAlign=o.align||'center';ctx.textBaseline='middle';ctx.translate(x,y);ctx.rotate(o.rot||0);ctx.fillText(txt,0,0);ctx.restore()}

/* ---------- mapa estilizado da baía ---------- */
const SF=[[700,1300],[690,900],[680,760],[690,640],[720,560],[790,520],[860,505],[940,500],[1010,515],[1060,560],[1075,640],[1065,720],[1090,800],[1120,860],[1090,930],[1110,1300]];
const MARIN=[[300,-300],[440,120],[540,250],[640,340],[740,400],[830,430],[900,410],[960,360],[1000,280],[1040,200],[1100,150],[1160,170],[1180,100],[1260,-300]];
const EAST=[[1520,-300],[1440,150],[1400,300],[1380,450],[1400,600],[1440,760],[1500,900],[1570,1300],[2600,1300],[2600,-300]];
const PTS=[[760,600],[820,560],[900,560],[980,580],[1030,620],[800,680],[880,660],[960,700],[1020,740],[780,780],[870,800],[960,820],[1040,860],[820,900],[920,940],[1000,980],[900,380],[980,330],[1440,400],[1430,560],[1470,720],[1090,300]];
function poly(p){ctx.beginPath();const n=p.length;const m=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];let s=m(p[n-1],p[0]);ctx.moveTo(s[0],s[1]);for(let i=0;i<n;i++){const q=m(p[i],p[(i+1)%n]);ctx.quadraticCurveTo(p[i][0],p[i][1],q[0],q[1])}ctx.closePath()}
const shipPos=u=>[lerp(565,545,u),lerp(820,470,u)];
function drawMap(tl,o={}){
  ctx.fillStyle='#07100f';ctx.fillRect(-1500,-1200,5000,3500);
  ctx.strokeStyle='rgba(150,180,175,.07)';ctx.lineWidth=1;for(let x=-1200;x<3200;x+=120){ctx.beginPath();ctx.moveTo(x,-1200);ctx.lineTo(x,2300);ctx.stroke()}for(let y=-1200;y<2300;y+=120){ctx.beginPath();ctx.moveTo(-1500,y);ctx.lineTo(3500,y);ctx.stroke()}
  for(const P of [MARIN,EAST,SF]){poly(P);ctx.fillStyle='#161f1d';ctx.fill();ctx.strokeStyle='rgba(175,198,192,.55)';ctx.lineWidth=2.2;ctx.stroke()}
  // ilhas
  ctx.fillStyle='#161f1d';ctx.strokeStyle='rgba(175,198,192,.5)';for(const [x,y,a,b] of [[1110,300,46,34],[1012,430,14,9],[1185,525,26,44]]){ctx.beginPath();ctx.ellipse(x,y,a,b,.3,0,7);ctx.fill();ctx.stroke()}
  // malha de ruas na cidade
  ctx.save();poly(SF);ctx.clip();ctx.strokeStyle='rgba(190,205,200,.11)';ctx.lineWidth=1;ctx.translate(900,750);ctx.rotate(-.13);for(let i=-700;i<700;i+=22){ctx.beginPath();ctx.moveTo(i,-700);ctx.lineTo(i,700);ctx.stroke();ctx.beginPath();ctx.moveTo(-700,i);ctx.lineTo(700,i);ctx.stroke()}ctx.restore();
  // pontes
  ctx.strokeStyle='rgba(215,225,220,.7)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(852,506);ctx.lineTo(842,432);ctx.stroke();ctx.beginPath();ctx.moveTo(1062,572);ctx.lineTo(1180,540);ctx.lineTo(1392,470);ctx.stroke();
  const la=o.labels??.6;
  label('OCEANO PACÍFICO',330,640,30,la*.8,{ls:10});label('SÃO FRANCISCO',885,720,30,la);label('BAÍA',1240,720,24,la*.7,{ls:9});label('MARIN',770,250,22,la*.6);label('OAKLAND',1600,560,22,la*.6);
  // pluma
  if(o.plume!==undefined){ctx.save();ctx.globalCompositeOperation='screen';const pt=o.plume,dur=o.plumeDur||4;
    for(let i=0;i<46;i++){const b=i/46*dur*.85;const age=pt-b;if(age<=0)continue;const [x0,y0]=shipPos(clamp(b/dur));const x=x0+Math.min(age,7)*135+Math.max(0,age-7)*22,y=y0+Math.sin(i*1.7)*16*age+age*6;const r=34+Math.min(age,9)*58;const a=.20*clamp(1-age/14)*clamp(age/.4);
      const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(226,70,66,${a})`);g.addColorStop(1,'rgba(226,70,66,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()}
    ctx.restore()}
  // navio
  if(o.ship!==undefined){const [sx,sy]=shipPos(o.ship);ctx.save();ctx.strokeStyle='rgba(230,235,230,.35)';ctx.setLineDash([8,10]);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(565,820);ctx.lineTo(sx,sy);ctx.stroke();ctx.setLineDash([]);
    ctx.translate(sx,sy);ctx.rotate(-.06);ctx.fillStyle='#eef2ee';ctx.beginPath();ctx.moveTo(0,-26);ctx.lineTo(9,-6);ctx.lineTo(9,22);ctx.lineTo(-9,22);ctx.lineTo(-9,-6);ctx.closePath();ctx.fill();ctx.restore()}
  // pontos de coleta
  if(o.pts!==undefined){PTS.forEach((p,i)=>{const d=(p[0]-700)/800*(o.ptsSpan||2.4)+.5+(i%3)*.08;const age=o.pts-d;if(age<0)return;
    const k=eOut(age/.25);ctx.strokeStyle=`rgba(240,236,220,${.8*clamp(1-age/1.2)})`;ctx.lineWidth=2;ctx.beginPath();ctx.arc(p[0],p[1],8+age*46,0,7);ctx.stroke();
    ctx.fillStyle='#f1ecd9';ctx.beginPath();ctx.arc(p[0],p[1],6*k,0,7);ctx.fill();ctx.strokeStyle='rgba(241,236,217,.7)';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(p[0],p[1],12*k,0,7);ctx.stroke()})}
}
function cam(sc,cx,cy,fn){ctx.save();ctx.translate(W/2,H/2);ctx.scale(sc,sc);ctx.translate(-cx,-cy);fn();ctx.restore()}

/* ---------- silhuetas ---------- */
function ship(x,y,s,col){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(-300,-34);ctx.lineTo(-262,30);ctx.lineTo(250,30);ctx.lineTo(296,-42);ctx.lineTo(232,-34);ctx.closePath();ctx.fill();
  ctx.fillRect(-190,-62,300,30);ctx.fillRect(-60,-104,130,44);ctx.fillRect(-20,-128,56,26);ctx.fillRect(-150,-98,34,38);ctx.fillRect(86,-72,60,12);ctx.fillRect(140,-66,46,4);
  ctx.fillRect(4,-232,5,106);ctx.fillRect(-22,-198,56,4);ctx.fillRect(-12,-172,36,3);ctx.fillRect(-244,-96,3,62);ctx.restore()}
function hospitalIcon(x,y,s,col){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle=col;ctx.fillRect(-170,-110,340,220);ctx.fillRect(-70,-190,140,90);ctx.fillStyle='#000';for(let r=0;r<3;r++)for(let c=0;c<6;c++){if(r===2&&(c===2||c===3))continue;ctx.fillRect(-148+c*52,-88+r*62,30,36)}ctx.fillRect(-22,36,44,74);
  ctx.fillStyle=RED2;ctx.fillRect(-9,-176,18,62);ctx.fillRect(-31,-154,62,18);ctx.restore()}

/* ---------- cenas ---------- */
const bRng=rng(4242);const BUILD=[];{let x=-60;while(x<W+60){const w=90+bRng()*150;BUILD.push({x,w,h:260+bRng()*420,seed:bRng()*1e6|0});x+=w+6}}
const bRng2=rng(777);const BUILD2=[];{let x=-80;while(x<W+80){const w=120+bRng2()*190;BUILD2.push({x,w,h:140+bRng2()*300,seed:bRng2()*1e6|0});x+=w+10}}
const COL=(()=>{const r=rng(31337),a=[];for(let i=0;i<170;i++){const ang=r()*6.283,rad=Math.sqrt(r())*300;a.push({x:Math.cos(ang)*rad,y:Math.sin(ang)*rad,d:r()*r()*2.6,s:3+r()*r()*17})}return a})();
const PART=(()=>{const r=rng(99),a=[];for(let i=0;i<300;i++)a.push({b:r(),vy:r()-.5,ph:r()*6.28,s:.6+r()*1.8,k:r()});return a})();

function sBridge(t,tl,dur){ // 1 · névoa e ponte
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0a1114');g.addColorStop(.62,'#27363a');g.addColorStop(.66,'#111b1e');g.addColorStop(1,'#04080a');ctx.fillStyle=g;ctx.fillRect(-100,-100,W+200,H+200);
  const push=1+tl*.006;cam(push,W/2,H/2+20,()=>{
    fog(t,.55,-80);
    const col='#04070a';ctx.fillStyle=col;ctx.strokeStyle=col;
    // morros
    ctx.beginPath();ctx.moveTo(-200,700);ctx.quadraticCurveTo(60,560,330,650);ctx.lineTo(420,700);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.moveTo(1500,700);ctx.quadraticCurveTo(1760,540,2150,690);ctx.lineTo(2150,720);ctx.closePath();ctx.fill();
    // tabuleiro e torres
    ctx.fillRect(180,636,1560,12);for(const x of [640,1280]){ctx.fillRect(x-20,322,14,400);ctx.fillRect(x+6,322,14,400);for(const y of [340,410,490,570])ctx.fillRect(x-20,y,40,10)}
    // cabos
    ctx.lineWidth=5;const cable=(x0,y0,x1,y1,sag)=>{ctx.beginPath();ctx.moveTo(x0,y0);ctx.quadraticCurveTo((x0+x1)/2,Math.max(y0,y1)+sag,x1,y1);ctx.stroke()};
    cable(640,326,1280,326,560);cable(180,636,640,326,-40);cable(1280,326,1740,636,-40);
    ctx.lineWidth=1.6;for(let x=660;x<1280;x+=26){const u=(x-640)/640;const y=326+4*u*(1-u)*280;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,636);ctx.stroke()}
    for(let x=200;x<640;x+=26){const u=(x-180)/460;const y=636-u*310+ (4*u*(1-u))*20;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,636);ctx.stroke();ctx.beginPath();ctx.moveTo(1920-x,y);ctx.lineTo(1920-x,636);ctx.stroke()}
    // faróis das torres
    for(const x of [640,1280]){const b=.5+.5*Math.sin(t*2.4+(x>700?1.3:0));const gg=ctx.createRadialGradient(x,318,0,x,318,46);gg.addColorStop(0,`rgba(230,50,50,${.9*b})`);gg.addColorStop(1,'rgba(230,50,50,0)');ctx.fillStyle=gg;ctx.fillRect(x-50,268,100,100)}
    // água
    ctx.fillStyle='rgba(180,200,205,.05)';for(let i=0;i<40;i++){const y=730+i*9;const x=((i*271)%1700)+Math.sin(t*.5+i)*30;ctx.fillRect(x,y,120+(i*53)%200,2)}
    fog(t+40,.5,120);
  });
  stamp('SETEMBRO DE 1950',W/2,850,190,'#e9e4d6',t-S[1].ini-.05);
  typed('SÃO FRANCISCO, CALIFÓRNIA',W/2,975,38,t-S[1].ini-2.9,{align:'center',ls:8});
  if(t<1.6){ctx.fillStyle=`rgba(0,0,0,${1-ease(t/1.6)})`;ctx.fillRect(-100,-100,W+200,H+200)}
}
function sMapQ(t,tl,dur){ // 2 · mapa + pergunta
  const u=tl/dur;cam(lerp(.92,1.04,ease(u)),lerp(900,930,u),lerp(580,600,u),()=>drawMap(tl,{labels:.55}));fog(t,.28);
  const q1='SERIA POSSÍVEL EXPOR UMA CIDADE',q2='A BACTÉRIAS LANÇADAS DO MAR?';
  ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(-100,838,W+200,190);
  typed(q1,W/2,892,46,tl-.05,{align:'center',cps:26,ls:4});typed(q2,W/2,962,46,tl-1.35,{align:'center',cps:26,ls:4,color:'#f0b9b4'});
}
function sTeste(t,tl,dur){ // 3 · O TESTE
  ctx.fillStyle='#030405';ctx.fillRect(-100,-100,W+200,H+200);fog(t,.22);
  typed('PARA DESCOBRIR...',W/2,400,40,tl-.1,{align:'center',ls:8,alpha:.7*clamp(1-(t-C.teste)/.2)});
  const a=t-C.teste;if(a>=0){const sh=a<.25?(1-a/.25)*14:0;ctx.save();ctx.translate(Math.sin(a*90)*sh,Math.cos(a*70)*sh);stamp('REALIZARAM O TESTE',W/2,540,168,RED2,a);ctx.restore()}
}
function sShip(t,tl,dur){ // 4 · navio e pluma
  const hz=650;const g=ctx.createLinearGradient(0,0,0,hz);g.addColorStop(0,'#081013');g.addColorStop(1,'#2c3b3f');ctx.fillStyle=g;ctx.fillRect(-100,-100,W+200,hz+100);
  ctx.fillStyle='#050a0c';ctx.fillRect(-100,hz,W+200,H);
  const push=1.02+tl*.008;cam(push,W/2+tl*8,H/2,()=>{
    fog(t,.5,-140);
    // costa e luzes ao longe
    ctx.fillStyle='#0a1215';ctx.beginPath();ctx.moveTo(1280,hz);ctx.quadraticCurveTo(1500,hz-70,1700,hz-40);ctx.quadraticCurveTo(1900,hz-90,2100,hz-30);ctx.lineTo(2100,hz);ctx.closePath();ctx.fill();
    const lr=rng(5);for(let i=0;i<60;i++){const x=1340+lr()*700,y=hz-6-lr()*34;const tw=.5+.5*Math.sin(t*3+i*2.2);ctx.fillStyle=`rgba(240,205,140,${.25+.45*tw*lr()})`;ctx.fillRect(x,y,3,3)}
    const bob=Math.sin(t*1.1)*5;const sx=560+tl*14,sy=hz+6+bob;
    // pluma
    ctx.save();ctx.globalCompositeOperation='screen';for(const p of PART){const b=p.b*dur*1.1-.6;const age=tl-b;if(age<=0||age>7)continue;
      const x=sx-250+age*(150+p.k*90)+Math.sin(age*1.3+p.ph)*24,y=sy-46-age*(26+p.k*30)+p.vy*age*46+Math.sin(age*2+p.ph)*10;const r=(5+age*26)*p.s;const a=.16*clamp(age/.3)*clamp(1-age/7);
      const gg=ctx.createRadialGradient(x,y,0,x,y,r);gg.addColorStop(0,`rgba(232,96,88,${a})`);gg.addColorStop(1,'rgba(232,96,88,0)');ctx.fillStyle=gg;ctx.fillRect(x-r,y-r,2*r,2*r)}ctx.restore();
    ship(sx,sy,.92,'#020405');
    // reflexo e marolas
    ctx.fillStyle='rgba(2,4,5,.55)';ctx.fillRect(sx-250,sy+28,500,16);
    ctx.fillStyle='rgba(190,210,214,.07)';for(let i=0;i<46;i++){const y=hz+18+i*9;const x=((i*313)%1900)-100+Math.sin(t*.6+i)*40;ctx.fillRect(x,y,90+(i*71)%240,2)}
